<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para_Sydney.exe</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        /* FONDO Y ESTÉTICA CRT */
        body {
            background-color: #051005; color: #4af626; font-family: 'VT323', monospace;
            padding: 0; margin: 0; overflow: hidden; display: flex; flex-direction: column;
            justify-content: center; align-items: center; height: 100vh; width: 100vw;
            text-shadow: 0 0 3px #4af626, 0 0 8px #228d11; 
        }

        /* EFECTO PANTALLA ANTIGUA (SCANLINES) */
        body::after {
            content: " "; display: block; position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
            z-index: 999; background-size: 100% 4px, 100% 100%; pointer-events: none; 
        }

        /* MARCO RETRO DECORATIVO */
        .marco-retro {
            position: absolute; top: 2%; bottom: 2%; left: 2%; right: 2%;
            border: 2px solid #4af626; box-shadow: 0 0 10px #4af626, inset 0 0 10px #4af626;
            border-radius: 10px; pointer-events: none; z-index: 5;
        }
        .deco-sup {
            position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
            background-color: #051005; padding: 0 10px; font-size: 18px;
        }
        .deco-inf {
            position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%);
            background-color: #051005; padding: 0 10px; font-size: 18px;
        }
        .deco-lateral {
            position: absolute; top: 10%; bottom: 10%; width: 20px;
            font-size: 12px; opacity: 0.3; word-break: break-all; overflow: hidden;
            line-height: 1.2; text-align: center;
        }
        .deco-izq { left: 5px; } .deco-der { right: 5px; }

        /* CONTENEDOR PRINCIPAL - Forzado arriba rozando la decoración */
        #terminal {
            width: 85%; max-width: 420px; height: 85vh;
            padding: 15px 10px 10px 10px; position: relative; z-index: 10;
            display: flex; flex-direction: column; 
            justify-content: flex-start; align-items: center; /* Alineado arriba */
            gap: 12px; /* Reducido para evitar que baje mucho */
        }

        /* --- CAJA DEL MUÑECO SEMÁFORO LED --- */
        .semaforo-box {
            background-color: #111; border: 2px solid #222; border-radius: 15px;
            padding: 6px 10px; display: none; box-shadow: 0 0 15px #000 inset, 0 0 10px #4af626;
            margin-top: 5px; /* Pequeño espacio con el borde superior */
        }
        #led-man {
            font-family: monospace; color: #4af626;
            text-shadow: 0 0 5px #4af626, 0 0 15px #4af626;
            margin: 0; font-size: 18px; line-height: 1.1; white-space: pre; text-align: center;
        }

        /* --- CONTENEDOR DE ESCENAS ASCII (CARRO, COHETE, ETC) --- */
        #escena-ascii {
            width: 100%; height: 80px; position: relative; overflow: hidden;
            display: none; align-items: flex-end; justify-content: center;
        }
        
        .carro-container {
            position: absolute; bottom: 0; left: -150px; display: flex; align-items: flex-end;
            animation: drive 4s linear forwards;
        }
        @keyframes drive { 0% { left: -150px; } 100% { left: 100%; } }
        
        .cohete-anim {
            position: absolute; bottom: -100px; color: #0ff; text-shadow: 0 0 10px #0ff;
            animation: fly 3s ease-in forwards; white-space: pre; font-size: 14px;
        }
        @keyframes fly { 0% { bottom: -100px; } 100% { bottom: 150px; } }

        .humo { font-size: 12px; margin-right: 5px; color: #aaa; animation: puff 1s infinite linear; }
        @keyframes puff { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-20px) scale(2); } }

        .corazon-rebotando {
            color: #ff3333; text-shadow: 0 0 10px #ff3333; font-size: 18px; margin-right: 15px;
            animation: bounce 0.5s ease-in-out infinite alternate;
        }
        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-20px); } }

        /* --- ESCENA BESO Y CORAZONES INFINITOS --- */
        .escena-beso-container {
            position: relative; display: flex; flex-direction: column;
            align-items: center; justify-content: center; width: 100%; height: 100px;
        }
        .pareja-beso {
            color: #4af626; text-shadow: 0 0 8px #4af626; font-size: 28px;
            white-space: pre; text-align: center; z-index: 12; line-height: 1.2;
        }
        .corazon-beso {
            color: #ff3333; text-shadow: 0 0 10px #ff3333; font-size: 24px;
            position: absolute; bottom: 35px; animation: beat 0.6s infinite alternate; z-index: 15;
        }
        @keyframes beat { 0% { transform: scale(1); } 100% { transform: scale(1.25); } }

        /* Corazones flotantes infinitos */
        .corazon-flotante {
            position: absolute; color: #ff3333; text-shadow: 0 0 8px #ff3333;
            font-size: 18px; bottom: 40px; pointer-events: none; opacity: 0;
            animation: flotarCorazon 3s infinite ease-out;
        }
        @keyframes flotarCorazon {
            0% { transform: translateY(0) translateX(0) scale(0.5); opacity: 0; }
            15% { opacity: 0.9; }
            100% { transform: translateY(-80px) translateX(var(--random-x, 0px)) scale(1.2); opacity: 0; }
        }

        /* --- HISTORIA: FOTOS Y ESCENA PIXEL --- */
        #galeria { width: 100%; display: none; flex-direction: column; align-items: center; gap: 4px; }
        #galeria img { max-width: 100%; max-height: 30vh; border: 2px solid #4af626; box-shadow: 0 0 10px #4af626; object-fit: contain; }
        #galeria .hint { font-size: 15px; opacity: 0.7; }
        .grid-momentos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; }
        .moment-card { position: relative; width: 100%; padding: 0; aspect-ratio: 1.1; overflow: hidden; border: 1px solid #4af626; background: #051005; }
        .moment-card img { display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0.72; cursor: pointer; transition: transform 180ms ease, opacity 180ms ease; }
        .moment-card:hover img { transform: scale(1.06); opacity: 1; }
        .moment-card.fav { border: 2px solid #ff5a75; box-shadow: 0 0 14px #ff5a75; }
        .moment-card span { position: absolute; right: 5px; bottom: 4px; color: white; font: 18px 'VT323', monospace; text-shadow: 0 0 5px #ff334e; }
        .moment-card.fav span { font-size: 14px; }
        #canvas-pixel { display: none; width: 100%; max-width: 520px; aspect-ratio: 32 / 15; height: auto; image-rendering: pixelated; border: 2px solid #4af626; background: #000; box-shadow: 0 0 20px rgba(74, 246, 38, 0.28); }
        #controles { display: none; gap: 6px; width: 100%; justify-content: center; }
        #controles button { flex: 1; width: auto; min-width: 0; min-height: 44px; user-select: none; touch-action: none; }
        #controles button[data-salto] { color: #ffc857; border-color: #ffc857; text-shadow: 0 0 6px #ffc857; }
        .pixel-hint { margin: 0; font-size: 16px; color: #b7ffae; text-shadow: 0 0 6px #4af626; }
        #companero {
            display: none; position: fixed; left: 50%; bottom: 2.8vh; transform: translateX(-50%);
            width: min(360px, 82vw); height: 64px; overflow: hidden; z-index: 15; pointer-events: none;
            border-bottom: 1px solid rgba(74, 246, 38, 0.75);
            background: linear-gradient(180deg, rgba(5, 16, 5, 0), rgba(5, 16, 5, 0.92));
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3);
        }
        #companero.visible { display: block; }
        #canvas-companero { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

        /* TEXTOS Y BOTONES - Centrados */
        #texto-consola {
            font-size: 23px; line-height: 1.25; 
            min-height: 80px; width: 100%; text-align: center;
        }
        .cursor::after { content: "█"; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* CONTENEDOR DE BOTONES - Centrado */
        .btn-container {
            width: 100%;
            display: flex; flex-direction: column; gap: 8px; align-items: center;
            justify-content: center;
        }
        button {
            background-color: #051005; color: #4af626; border: 1px solid #4af626;
            padding: 8px; font-family: 'VT323', monospace; font-size: 21px;
            cursor: pointer; width: 95%; text-shadow: 0 0 5px #4af626;
            box-shadow: inset 0 0 8px rgba(74, 246, 38, 0.3); position: relative; z-index: 1000;
        }
        button:active { background-color: #4af626; color: #051005; }
        #btn-no-final { position: relative; transition: all 0.2s ease-out; }

        /* Ajuste específico de pantalla de inicio para centrarla en esta nueva distribución */
        #pantalla-inicio {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100%; width: 100%;
        }
    </style>
</head>
<body>

    <audio id="bg-music" src="cancion.mp3" loop></audio>

    <div class="marco-retro">
        <div class="deco-sup">[ SYS.HACK.v99 ]</div>
        <div class="deco-inf">CONEXIÓN ENCRIPTADA</div>
    </div>
    <div class="deco-lateral deco-izq">010010110110010101111001</div>
    <div class="deco-lateral deco-der">98A7F6C239B100FF45EE890</div>

    <div id="terminal">
        <div id="pantalla-inicio">
            <p class="cursor" style="font-size: 24px; margin-bottom: 25px;">buscando_a_sydney.exe</p>
            <button onclick="arrancarSistema()">> INICIAR CONEXIÓN <</button>
            <p style="font-size: 16px; margin-top: 15px; color:#3a7a28;">(Sube el volumen 🎧)</p>
        </div>

        <!-- EL SEMÁFORO LED (Rozará la parte superior de la pantalla) -->
        <div id="semaforo" class="semaforo-box">
            <div id="led-man"></div>
        </div>

        <!-- ESCENAS ASCII (Carro, cohete, etc) -->
        <div id="escena-ascii"></div>

        <div id="galeria"></div>
        <canvas id="canvas-pixel" width="320" height="150"></canvas>
        <div id="controles">
            <button id="btn-izq">◀</button>
            <button id="btn-salto" data-salto aria-label="Saltar" title="Saltar">↑</button>
            <button id="btn-der">▶</button>
            <button id="btn-sonido" aria-label="Silenciar efectos">♪</button>
        </div>

        <!-- TEXTO Y BOTONES -->
        <div id="texto-consola" style="display: none;"></div>
        <div id="botones-dinamicos" class="btn-container" style="display:none;"></div>
    </div>

    <div id="companero" aria-hidden="true"><canvas id="canvas-companero" width="320" height="64"></canvas></div>

    <script>
        const audio = document.getElementById('bg-music');
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const semaforoBox = document.getElementById('semaforo');
        const ledMan = document.getElementById('led-man');
        const escenaAscii = document.getElementById('escena-ascii');
        const textoConsola = document.getElementById('texto-consola');
        const botonesDinamicos = document.getElementById('botones-dinamicos');
        const companero = document.getElementById('companero');
        const canvasCompanero = document.getElementById('canvas-companero');
        const ctxCompanero = canvasCompanero.getContext('2d');
        const estadoCompanero = { escena: 'inicio', accion: 'caminar', x: -18, t: 0 };
        let animacionCompanero;

        function setEscenaCompanero(escena, accion = 'caminar') {
            estadoCompanero.escena = escena;
            estadoCompanero.accion = accion;
            companero.classList.add('visible');
            if (!animacionCompanero) animacionCompanero = requestAnimationFrame(animarCompanero);
        }

        function escenaCompaneroDeCapitulo(texto) {
            if (texto.includes('Caracas')) setEscenaCompanero('caracas', 'caminar');
            else if (texto.includes('lanzamiento')) setEscenaCompanero('cohete', 'pensar');
            else if (texto.includes('oficina')) setEscenaCompanero('oficina', 'trabajar');
            else if (texto.includes('teléfono')) setEscenaCompanero('telefono', 'cargar');
            else if (texto.includes('foto favorita') || texto.includes('otro momento')) setEscenaCompanero('momentos', 'cargar');
            else setEscenaCompanero('inicio', 'caminar');
        }

        function pintarCompanero(color, x, y, ancho, alto) {
            ctxCompanero.fillStyle = color;
            ctxCompanero.fillRect(Math.round(x), Math.round(y), ancho, alto);
        }

        function animarCompanero() {
            const ctx = ctxCompanero;
            const escena = estadoCompanero.escena;
            const accion = estadoCompanero.accion;
            const t = estadoCompanero.t++;
            const ancho = canvasCompanero.width;
            const alto = canvasCompanero.height;
            ctx.clearRect(0, 0, ancho, alto);

            const cielos = {
                inicio: '#071608', carro: '#102139', caracas: '#243d60', cohete: '#111438',
                oficina: '#182033', juegos: '#164334', telefono: '#30233c', momentos: '#17353a',
                banco: '#122a4a', escritorio: '#20243a', parque: '#427d72', noche: '#171936',
                atardecer: '#944b62', camino: '#50334f', beso: '#753553', pregunta: '#792e59'
            };
            const suelos = {
                inicio: '#1b481b', carro: '#43536a', caracas: '#53627a', cohete: '#292949',
                oficina: '#4c4037', juegos: '#367347', telefono: '#584452', momentos: '#286056',
                banco: '#3f7544', escritorio: '#56473d', parque: '#609447', noche: '#35344e',
                atardecer: '#435d3d', camino: '#6c5541', beso: '#3b5632', pregunta: '#46364d'
            };
            ctx.fillStyle = cielos[escena] || cielos.inicio;
            ctx.fillRect(0, 0, ancho, alto);
            if (escena === 'cohete' || escena === 'noche') {
                for (let i = 0; i < 18; i++) {
                    pintarCompanero(i % 4 ? '#a6b9df' : '#ffe69a', (i * 53 + 17) % ancho, 5 + (i * 19) % 35, 2, 2);
                }
            } else if (escena === 'oficina' || escena === 'escritorio') {
                pintarCompanero('#33455e', 22, 8, 45, 30);
                pintarCompanero('#f5cd78', 31, 15, 3, 3);
                pintarCompanero('#f5cd78', 48, 25, 3, 3);
                pintarCompanero('#29324a', 245, 20, 48, 24);
            } else if (escena === 'juegos' || escena === 'parque') {
                for (let i = 0; i < 4; i++) {
                    const tx = 24 + i * 83;
                    pintarCompanero('#624630', tx + 10, 22, 6, 24);
                    pintarCompanero(i % 2 ? '#278353' : '#328e55', tx, 10, 28, 20);
                }
            } else if (escena === 'caracas') {
                for (let i = 0; i < 7; i++) pintarCompanero('#344760', i * 49, 19 + (i % 3) * 8, 38, 29 - (i % 3) * 4);
            } else if (escena === 'atardecer' || escena === 'beso' || escena === 'pregunta') {
                ctx.fillStyle = '#ffd781';
                ctx.beginPath(); ctx.arc(252, 31, 13, 0, Math.PI * 2); ctx.fill();
                pintarCompanero('rgba(255,198,145,0.45)', 196, 20, 24, 4);
                pintarCompanero('rgba(255,198,145,0.45)', 205, 16, 15, 4);
            } else if (escena === 'telefono') {
                pintarCompanero('#766079', 220, 20, 6, 22);
                pintarCompanero('#a5dce0', 205, 35, 36, 3);
            } else if (escena === 'momentos') {
                for (let i = 0; i < 5; i++) pintarCompanero(i % 2 ? '#ff7c99' : '#ffe27c', 36 + i * 55, 17 + (i % 2) * 7, 15, 15);
            }
            ctx.fillStyle = suelos[escena] || suelos.inicio;
            ctx.fillRect(0, 53, ancho, 11);
            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            ctx.fillRect(0, 53, ancho, 2);

            const x = accion === 'beso' ? 145 : estadoCompanero.x;
            const rebote = accion === 'jugar' ? Math.abs(Math.sin(t / 5)) * 4 : 0;
            const y = 52 - rebote;
            const paso = Math.floor(t / 7) % 2;
            pintarCompanero('#172117', x - 3, 51, 22, 3);
            pintarCompanero('#e2ae7e', x + 4, y - 30, 10, 9);
            pintarCompanero('#3b271f', x + 3, y - 31, 12, 4);
            pintarCompanero(escena === 'beso' || escena === 'pregunta' ? '#df5b88' : '#e34545', x + 2, y - 21, 14, 11);
            pintarCompanero('#283bb0', x + 3, y - 10, 5, 9 - paso * 3);
            pintarCompanero('#283bb0', x + 10, y - 10, 5, 6 + paso * 3);
            pintarCompanero('#f2c38f', x - 2, y - 19, 4, 9);
            pintarCompanero('#f2c38f', x + 16, y - 19, 4, 9);

            if (accion === 'conducir') {
                pintarCompanero('#d34545', x - 5, 44, 30, 9);
                pintarCompanero('#8bd5ee', x + 2, 39, 15, 7);
                pintarCompanero('#111', x, 51, 6, 5);
                pintarCompanero('#111', x + 17, 51, 6, 5);
            } else if (accion === 'cargar') {
                pintarCompanero('#ff5a75', x + 7, y - 39, 7, 7);
            } else if (accion === 'jugar') {
                pintarCompanero('#f2df48', x + 24 + Math.sin(t / 4) * 3, 45 - Math.abs(Math.sin(t / 4)) * 8, 6, 6);
            } else if (accion === 'trabajar') {
                pintarCompanero('#4af626', x + 18, y - 13, 9, 7);
            } else if (accion === 'pensar') {
                pintarCompanero('#fff', x + 18, y - 37, 3, 3);
                pintarCompanero('#fff', x + 23, y - 42, 4, 4);
            } else if (accion === 'beso') {
                pintarCompanero('#f2c38f', 166, y - 30, 10, 9);
                pintarCompanero('#744019', 165, y - 31, 12, 4);
                pintarCompanero('#ff7caf', 164, y - 21, 14, 11);
                pintarCompanero('#ff5a75', 151, y - 40 - Math.sin(t / 5) * 2, 7, 7);
            }

            estadoCompanero.x += accion === 'conducir' ? 1.15 : 0.62;
            if (estadoCompanero.x > ancho + 8) estadoCompanero.x = -24;
            animacionCompanero = requestAnimationFrame(animarCompanero);
        }

        // ANIMACIONES DEL MUÑECO LED (Semáforo)
        const framesCaminar = [
            "  O  \n /█\\ \n / \\ ",
            "  O  \n /█> \n  >\\ "
        ];
        const framesPensar = [
            "  O ?\n /█\\ \n / \\ "
        ];
        const framesBailar = [
            " \\O/ \n  █  \n / \\ ",
            "  O  \n /█\\ \n / \\ "
        ];

        let intervaloMuneco;
        function setEstadoMuneco(estado) {
            clearInterval(intervaloMuneco);
            let frames = framesPensar;
            let velocidad = 500;

            if(estado === 'caminar') { frames = framesCaminar; velocidad = 400; }
            if(estado === 'bailar') { frames = framesBailar; velocidad = 300; }

            let i = 0;
            ledMan.innerText = frames[0];
            if(frames.length > 1) {
                intervaloMuneco = setInterval(() => {
                    i = (i + 1) % frames.length;
                    ledMan.innerText = frames[i];
                }, velocidad);
            }
        }

        // ESCRITURA MÁQUINA
        function typeWriter(texto, callback) {
            textoConsola.innerHTML = "";
            let i = 0;
            textoConsola.classList.add('cursor');
            setEstadoMuneco('caminar');

            function escribir() {
                if (i < texto.length) {
                    textoConsola.innerHTML += texto.charAt(i);
                    i++;
                    setTimeout(escribir, 40);
                } else {
                    textoConsola.classList.remove('cursor');
                    setEstadoMuneco('pensar');
                    if (callback) callback();
                }
            }
            escribir();
        }

        function limpiarEscena() {
            botonesDinamicos.style.display = 'none';
            escenaAscii.innerHTML = '';
            escenaAscii.style.display = 'none';
            limpiarHistoria();
        }

        function arrancarSistema() {
            sonidoRetro(523, 0.18, 'triangle');
            setEscenaCompanero('inicio', 'caminar');
            pantallaInicio.style.display = 'none';
            textoConsola.style.display = 'block';
            textoConsola.innerHTML = "<span class='cursor'>Conectando a servidor seguro...</span>";
            
            // ADELANTAR LA CANCIÓN 5 SEGUNDOS Y REPRODUCIR
            audio.currentTime = 5; 
            audio.volume = 1;
            audio.play();

            // Esperar 4 segundos de música antes de la primera escena
            setTimeout(() => {
                fase1();
            }, 4000);
        }

        function fase1() {
            setEscenaCompanero('carro', 'conducir');
            limpiarEscena();
            semaforoBox.style.display = 'inline-block';
            escenaAscii.style.display = 'flex';
            
            // Animación del carro con el corazón
            escenaAscii.innerHTML = `
                <div class="carro-container">
                    <div class="corazon-rebotando">♥</div>
                    <div class="humo">o O .</div>
                    <div style="line-height: 1; white-space: pre; font-size: 14px;"> .---.\n=[_---_]\n -(o)-(o)-</div>
                </div>`;

            typeWriter("Hola Sydney. Estás en la segunda vez que te veo por aquí...", () => {
                setTimeout(() => botonSeguir(() => iniciarHistoria('si'), '> Continuar <'), 2000);
            });
        }

        // ================= HISTORIA INTERACTIVA =================
        const FOTO_CARACAS = 'Caracas.jpeg';
        const FOTO_FAVORITA = 'foto favorita.jpg';
        const FOTO_OTRO_MOMENTO = 'Otro momento.jpg';
        const FOTO_OFICINA = 'Oficina.jpg';
        const FOTOS_MOMENTOS = [1, 2, 3, 4, 5].map(n => `Momentos (${n}).jpg`);
        const FOTOS_TELEFONO = ['te quedaste con mi telefono.jpg']
            .concat([1, 2, 3, 4, 5].map(n => `te quedaste con mi telefono (${n}).jpg`));

        const galeria = document.getElementById('galeria');
        const canvas = document.getElementById('canvas-pixel');
        const ctx = canvas.getContext('2d');
        const controles = document.getElementById('controles');

        const pasos = [];
        let pasoIdx = 0;
        let respuestaHistoria = 'si';
        let rafId = null;
        const S = { escena: '', x: 20, dir: 0, sentado: false, t: 0, corazones: [], y: 0, vy: 0, suelo: true, ultimoPaso: 0, stage: 0, frase: 0, objetoX: 270, fraseTomada: false, obstaculos: [] };
        const RECUERDOS = [
            { fondo: 'escritorio', titulo: 'El escritorio', frases: ['Dos meses raros y bonitos.', 'Trabajo, estudio... y pienso en ti.'] },
            { fondo: 'parque', titulo: 'Un respiro', frases: ['Intento despejar mi mente.', 'Y ahí estás. ¿Qué me hiciste?', 'A veces pienso en darte tiempo.'] },

        const OBSTACULOS_RECUERDO = [
            [{ x: 78, w: 18, h: 15, tipo: 'caja' }, { x: 150, w: 24, h: 19, tipo: 'libros' }, { x: 218, w: 20, h: 12, tipo: 'cable' }],
            [{ x: 72, w: 27, h: 20, tipo: 'matorral' }, { x: 143, w: 22, h: 14, tipo: 'roca' }, { x: 211, w: 30, h: 10, tipo: 'raiz' }],
            [{ x: 82, w: 17, h: 20, tipo: 'cono' }, { x: 151, w: 25, h: 15, tipo: 'caja' }, { x: 218, w: 21, h: 18, tipo: 'neon' }],
            [{ x: 75, w: 30, h: 10, tipo: 'charco' }, { x: 145, w: 23, h: 18, tipo: 'roca' }, { x: 215, w: 25, h: 14, tipo: 'matorral' }],

        let sintetizador;
        let efectosActivos = true;

        function sonidoRetro(frecuencia = 660, duracion = 0.09, forma = 'square') {
            if (!efectosActivos) return;
            try {
                sintetizador ||= new (window.AudioContext || window.webkitAudioContext)();
                if (sintetizador.state === 'suspended') sintetizador.resume();
                const oscilador = sintetizador.createOscillator();
                const volumen = sintetizador.createGain();
                oscilador.type = forma;
                oscilador.frequency.setValueAtTime(frecuencia, sintetizador.currentTime);
                volumen.gain.setValueAtTime(0.045, sintetizador.currentTime);
                volumen.gain.exponentialRampToValueAtTime(0.001, sintetizador.currentTime + duracion);
                oscilador.connect(volumen);
                volumen.connect(sintetizador.destination);
                oscilador.start();
                oscilador.stop(sintetizador.currentTime + duracion);
            } catch (_) {}
        }

        function descargarMomento(nombre) {
            const enlace = document.createElement('a');

        // ---------- Escena pixel art ----------
        const SUELO = 130;
        const BANCO_X = 228;

        function rect(c, x, y, w, h) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }

        function persona(x, y, pose, opts = {}) {
            const piel = '#f2c38f';
            const pelo = opts.pelo || '#3b2a1a';
            const ropa = opts.ropa || '#e03c3c';
            const pantalon = opts.pantalon || '#2a3cb0';
            const f = Math.floor(S.t / 8) % 2;
            if (pose === 'sentado') {
                rect(pantalon, x + 2, y - 10, 14, 5);
                rect(pantalon, x + 13, y - 5, 4, 5);
            } else if (pose === 'camina') {
                rect(pantalon, x + 1, y - (f ? 6 : 10), 5, f ? 6 : 10);
                rect(pantalon, x + 8, y - (f ? 10 : 6), 5, f ? 10 : 6);
            } else {
                rect(pantalon, x + 1, y - 10, 5, 10);
                rect(pantalon, x + 8, y - 10, 5, 10);
            }
            rect(ropa, x, y - 22, 14, 12);
            rect(piel, x + 1, y - 32, 12, 10);
            rect(pelo, x + 1, y - 32, 12, 3);
            if (opts.largo) { rect(pelo, x, y - 32, 2, 16); rect(pelo, x + 12, y - 32, 2, 16); }
            rect('#000', x + (opts.mira === -1 ? 3 : 8), y - 27, 2, 2);
        }

        function banco(y) {
            rect('#7a4b1e', BANCO_X, y - 24, 56, 3);
            rect('#7a4b1e', BANCO_X, y - 7, 56, 4);
            rect('#4d2f12', BANCO_X + 4, y - 3, 3, 3);
            rect('#4d2f12', BANCO_X + 49, y - 3, 3, 3);
            rect('#4d2f12', BANCO_X + 1, y - 24, 3, 17);
        }

        function cielo(colores) {
            const h = SUELO / colores.length;
            colores.forEach((c, i) => rect(c, 0, i * h, 320, Math.ceil(h)));
        }

        function fondoRecuerdo(tipo) {
            if (tipo === 'escritorio') {
                rect('#13182b', 0, 0, 320, SUELO);
                rect('#273653', 16, 22, 74, 55);
                rect('#92c9e8', 20, 26, 66, 47);

            } else if (tipo === 'parque') {
                cielo(['#4c98bf', '#81bdc6', '#a6d59b']);
                rect('#40774a', 0, SUELO - 12, 320, 32);
                for (let x = 24; x < 320; x += 92) {
                    rect('#684b35', x + 12, 70, 8, 54);
                    rect('#24744b', x, 46, 32, 34);
                    rect('#338d53', x - 8, 58, 48, 24);
                }
                rect('#c8ad69', 0, SUELO + 6, 320, 5);

                cielo(['#10132f', '#1b2050', '#2b3263']);
                for (let i = 0; i < 22; i++) rect(i % 3 ? '#f5e9a0' : '#fff', (i * 67 + 19) % 320, (i * 31 + 8) % 78, 2, 2);
                for (let x = 0; x < 320; x += 34) {

                cielo(['#39295e', '#8d4d79', '#dd7866', '#f4a55d']);
                ctx.fillStyle = '#ffe7a0';
                ctx.beginPath(); ctx.arc(238, 89, 25, 0, Math.PI * 2); ctx.fill();
                rect('#5d4665', 0, 108, 320, 22);

                cielo(['#272349', '#60446c', '#cb726b', '#edaa65']);
                for (let x = 0; x < 320; x += 42) rect('#344b3a', x, 100 - (x % 3) * 5, 30, 35);

        function dibujarObjetoRecuerdo() {
            if (S.fraseTomada) return;
            const pulso = 1 + Math.sin(S.t / 8) * 0.16;
            const cx = S.objetoX + 7;
            const cy = SUELO - 36;
            const tonos = ['#75f4ff', '#ffe176', '#ff80bc', '#b7a1ff', '#ff8d62'];
            ctx.save();
            ctx.globalAlpha = 0.3 + Math.sin(S.t / 8) * 0.1;
            ctx.fillStyle = tonos[S.stage % tonos.length];
            ctx.beginPath(); ctx.arc(cx, cy, 18 * pulso, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
            ctx.fillStyle = tonos[S.stage % tonos.length];
            ctx.shadowColor = tonos[S.stage % tonos.length];
            ctx.shadowBlur = 12;
            ctx.font = '22px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(['▣', '✦', '♥', '♫', '✉'][S.frase % 5], cx, cy + 7);
            ctx.shadowBlur = 0;
            ctx.textAlign = 'start';
        }

        function dibujarObstaculos() {
            S.obstaculos.forEach(obstaculo => {
                const y = SUELO - obstaculo.h;
                if (obstaculo.tipo === 'caja') {
                    rect('#93552e', obstaculo.x, y, obstaculo.w, obstaculo.h);
                    rect('#c47a43', obstaculo.x + 3, y + 3, obstaculo.w - 6, 3);
                    rect('#573522', obstaculo.x + 4, y + 8, 3, obstaculo.h - 9);
                } else if (obstaculo.tipo === 'libros') {
                    rect('#c95858', obstaculo.x, SUELO - 7, obstaculo.w, 7);
                    rect('#e2bf58', obstaculo.x + 3, SUELO - 14, obstaculo.w - 4, 7);
                    rect('#6288bc', obstaculo.x + 1, y, obstaculo.w - 2, 7);
                } else if (obstaculo.tipo === 'matorral' || obstaculo.tipo === 'flores') {
                    rect('#68472d', obstaculo.x + 10, SUELO - 9, 6, 9);
                    rect(obstaculo.tipo === 'flores' ? '#e478a1' : '#24744b', obstaculo.x, y + 5, 13, 11);
                    rect(obstaculo.tipo === 'flores' ? '#ffd56f' : '#328e55', obstaculo.x + 10, y, 16, 15);
                    rect(obstaculo.tipo === 'flores' ? '#e478a1' : '#24744b', obstaculo.x + 19, y + 7, 10, 9);
                } else if (obstaculo.tipo === 'roca') {
                    rect('#697282', obstaculo.x + 3, y + 5, obstaculo.w - 6, obstaculo.h - 5);
                    rect('#9ca6b0', obstaculo.x + 7, y + 2, obstaculo.w - 14, 6);
                } else if (obstaculo.tipo === 'cono') {
                    ctx.fillStyle = '#ff9d43';
                    ctx.beginPath(); ctx.moveTo(obstaculo.x + obstaculo.w / 2, y); ctx.lineTo(obstaculo.x + obstaculo.w, SUELO); ctx.lineTo(obstaculo.x, SUELO); ctx.fill();
                    rect('#fff0cb', obstaculo.x + 5, y + obstaculo.h * 0.62, obstaculo.w - 10, 3);
                } else if (obstaculo.tipo === 'charco') {
                    rect('#39c8df', obstaculo.x, SUELO - 5, obstaculo.w, 5);
                    rect('#b4f8ff', obstaculo.x + 4, SUELO - 5, 7, 2);
                } else if (obstaculo.tipo === 'raiz') {
                    rect('#8b603d', obstaculo.x, SUELO - 7, obstaculo.w, 7);
                    rect('#a4774d', obstaculo.x + 5, y, 9, obstaculo.h);
                    rect('#8b603d', obstaculo.x + 12, y + 7, 8, 6);
                } else if (obstaculo.tipo === 'cable') {
                    rect('#f4d34e', obstaculo.x, SUELO - 5, obstaculo.w, 5);
                    rect('#252536', obstaculo.x + 4, SUELO - 3, obstaculo.w - 8, 2);
                } else if (obstaculo.tipo === 'neon') {
                    rect('#37274c', obstaculo.x, y, obstaculo.w, obstaculo.h);
                    rect('#e36fc5', obstaculo.x + 4, y + 4, obstaculo.w - 8, 3);
                    rect('#8c68db', obstaculo.x + 7, y + 10, obstaculo.w - 14, 3);
                }
            });
        }

        function revisarObstaculos() {
            const golpe = S.obstaculos.find(obstaculo =>
                S.x + 13 >= obstaculo.x && S.x <= obstaculo.x + obstaculo.w && S.y > -obstaculo.h
            );
            if (!golpe) return;
            S.x = Math.max(18, golpe.x - 24);
            S.dir = 0;
            S.y = 0; S.vy = 0; S.suelo = true;
            sonidoRetro(135, 0.16, 'sawtooth');
            textoConsola.innerHTML = '¡Uy! Pulsa ↑ o espacio para saltar y llegar al recuerdo.';
        }

        function tomarFraseRecuerdo() {
            if (S.fraseTomada) return;
            S.fraseTomada = true;
            S.dir = 0;
            controles.style.display = 'none';
            sonidoRetro(990, 0.18, 'triangle');
            typeWriter(RECUERDOS[S.stage].frases[S.frase], () => {
                setTimeout(() => botonSeguir(avanzarRecuerdo), 1400);
            });
        }

        function dibujar() {
            S.t++;
            if ((S.escena === 'banco' && !S.sentado) || S.escena === 'coleccion') {
                S.x = Math.max(5, Math.min(298, S.x + S.dir * 1.8));
                if (S.dir && S.t - S.ultimoPaso > 11) {
                    sonidoRetro(160 + Math.random() * 35, 0.045, 'triangle');
                    S.ultimoPaso = S.t;
                }
                if (!S.suelo) {
                    S.vy += 0.22;
                    S.y += S.vy;
                    if (S.y >= 0) {
                        S.y = 0; S.vy = 0; S.suelo = true;
                        sonidoRetro(230, 0.1, 'triangle');
                    }
                }
                if (S.escena === 'banco' && S.x >= BANCO_X - 7 && S.suelo) {
                    S.sentado = true;
                    S.x = BANCO_X + 10;
                    sonidoRetro(880, 0.14, 'triangle');
                    escenaBancoSentado();
                }
                if (S.escena === 'coleccion') {
                    revisarObstaculos();
                    if (S.x >= S.objetoX - 8 && S.suelo) tomarFraseRecuerdo();
                }
            }

            if (S.escena === 'banco') {
                cielo(['#0a1a3a', '#12285a', '#1c3b7a']);
                for (let i = 0; i < 14; i++) {
                    const sx = (i * 47 + 13) % 320;
                    const sy = 12 + (i * 29) % 70;
                    rect(S.t % 50 < 25 ? '#52769b' : '#a1b6d0', sx, sy, 2, 2);
                }
                rect('#142943', 0, SUELO - 24, 320, 24);
                for (let bx = 8; bx < 320; bx += 38) rect('#203a56', bx, SUELO - 35 - (bx % 3) * 6, 24, 35 + (bx % 3) * 6);
                rect('#315f35', 0, SUELO, 320, 20);
                rect('#75a94b', 0, SUELO, 320, 2);
                banco(SUELO);
                persona(S.x, SUELO + S.y, S.sentado ? 'sentado' : (!S.suelo || S.dir ? 'camina' : 'parado'));
            } else if (S.escena === 'coleccion') {
                fondoRecuerdo(RECUERDOS[S.stage].fondo);
                dibujarObstaculos();
                dibujarObjetoRecuerdo();
                persona(S.x, SUELO + S.y, !S.suelo || S.dir ? 'camina' : 'parado');
            } else if (S.escena === 'escritorio') {
                rect('#1a1a2a', 0, 0, 320, SUELO);
                for (let i = 0; i < 8; i++) {
                    rect('#27334b', i * 43, 30 + (i % 3) * 12, 31, SUELO - 30 - (i % 3) * 12);
                    rect('#ffc857', i * 43 + 7, 42 + (i % 3) * 12, 3, 3);
                }
                rect('#3a2a1a', 0, SUELO, 320, 20);
                rect('#8a5a2a', 150, SUELO - 24, 130, 4);
                rect('#5a3a1a', 156, SUELO - 20, 4, 20);
                rect('#5a3a1a', 270, SUELO - 20, 4, 20);
                rect('#111', 195, SUELO - 54, 40, 28);
                rect(S.t % 60 < 30 ? '#4af626' : '#1a8a10', 199, SUELO - 50, 32, 20);
                rect('#333', 211, SUELO - 26, 8, 2);
                rect('#555', 128, SUELO - 8, 20, 3);
                persona(130, SUELO, 'sentado');
            } else if (S.escena === 'atardecer' || S.escena === 'beso') {
                cielo(['#2b1a4a', '#7a2a6a', '#d0475a', '#ff8a3a', '#ffc04a']);
                for (let i = 0; i < 4; i++) {
                    const cx = (S.t * 0.18 + i * 92) % 370 - 30;
                    rect('rgba(255,220,190,0.35)', cx, 24 + i % 2 * 16, 18, 4);
                    rect('rgba(255,220,190,0.35)', cx + 5, 20 + i % 2 * 16, 12, 4);
                }
                ctx.fillStyle = '#ffe28a';
                ctx.beginPath(); ctx.arc(80, SUELO, 38, Math.PI, 0); ctx.fill();
                rect('#1a2a10', 0, SUELO, 320, 20);
                if (S.escena === 'atardecer') {
                    banco(SUELO);
                    persona(BANCO_X + 10, SUELO, 'sentado');
                } else {
                    persona(130, SUELO, 'parado');
                    persona(143, SUELO, 'parado', { pelo: '#7a3b1a', ropa: '#ff6fa8', pantalon: '#ff6fa8', largo: true, mira: -1 });
                    if (S.t % 14 === 0) {
                        S.corazones.push({ x: 140 + Math.random() * 20, y: SUELO - 40, v: 0.5 + Math.random() * 0.5, dx: Math.random() * 2 - 1 });
                    }
                    ctx.font = '16px monospace';
                    S.corazones = S.corazones.filter(h => h.y > 0);
                    S.corazones.forEach(h => {
                        h.y -= h.v; h.x += Math.sin(h.y / 10) * 0.5;
                        ctx.fillStyle = '#ff3333';
                        ctx.fillText('♥', h.x, h.y);
                    });
                }
            }
            rafId = requestAnimationFrame(dibujar);
        }

        function iniciarEscenaPixel(nombre) {
            limpiarEscena();
            canvas.style.display = 'block';
            S.escena = nombre;
            S.t = 0;
            S.y = 0; S.vy = 0; S.suelo = true;
            S.corazones = [];
            rafId = requestAnimationFrame(dibujar);
        }

        function iniciarRecuerdo(stage) {
            if (stage >= RECUERDOS.length) {
                escenaBeso();
                return;
            }
            const acciones = ['trabajar', 'caminar', 'pensar', 'caminar', 'cargar'];
            setEscenaCompanero(RECUERDOS[stage].fondo, acciones[stage]);
            iniciarEscenaPixel('coleccion');
            S.stage = stage;
            S.frase = 0;
            S.x = 18;
            S.objetoX = 268;
            S.fraseTomada = false;
            S.obstaculos = OBSTACULOS_RECUERDO[stage];
            controles.style.display = 'flex';
            textoConsola.style.display = 'block';
            textoConsola.innerHTML = `${RECUERDOS[stage].titulo}: usa ←/→ y salta con ↑ o espacio.`;
        }

        function avanzarRecuerdo() {
            S.frase++;
            if (S.frase >= RECUERDOS[S.stage].frases.length) {
                iniciarRecuerdo(S.stage + 1);
                return;
            }
            S.x = 18;
            S.objetoX = 268;
            S.fraseTomada = false;
            S.obstaculos = OBSTACULOS_RECUERDO[S.stage];
            controles.style.display = 'flex';
            textoConsola.innerHTML = `${RECUERDOS[S.stage].titulo}: salta con ↑/espacio o el botón ↑.`;
        }

        function dialogo(partes, i, fin) {
            botonesDinamicos.style.display = 'none';
            typeWriter(partes[i], () => {
                // Pausa de 2 segundos antes de mostrar el botón
                setTimeout(() => {
                    botonSeguir(() => (i + 1 < partes.length ? dialogo(partes, i + 1, fin) : fin()));
                }, 2000);
            });
        }

        function pasoBanco() {
            setEscenaCompanero('banco', 'caminar');
            iniciarEscenaPixel('banco');
            S.x = 20; S.sentado = false;
            controles.style.display = 'flex';
            textoConsola.style.display = 'block';
            textoConsola.innerHTML = "Lleva a nuestro personaje hasta el banco. Puedes moverte y saltar.";
        }

        function escenaBancoSentado() {
            controles.style.display = 'none';
            S.dir = 0;
            typeWriter('Aquí empieza nuestro pequeño viaje.', () => {
                setTimeout(() => botonSeguir(() => iniciarRecuerdo(0)), 1400);
            });
        }

        function escenaEscritorio() {
            iniciarRecuerdo(0);
        }

        function escenaAtardecer() {
            iniciarRecuerdo(3);
        }

        function escenaBeso() {
            setEscenaCompanero('beso', 'beso');
            iniciarEscenaPixel('beso');
            typeWriter("Estoy enamorado de ti.", () => {
                setTimeout(() => botonSeguir(sigPaso), 2000);
            });
        }

        function iniciarHistoria(respuesta) {
            respuestaHistoria = respuesta;
            pasoIdx = 0;
            pasos.length = 0;
            semaforoBox.style.display = 'none';
            pasos.push(
                capitulo("Ya llevamos 2 meses, sin contar ese mes de dudas. Y aun así, aquí estamos... escribiendo nuestra historia."),
                capitulo("Ese momento en Caracas, esa foto de nuestras piernas... nunca imaginé enamorarme de alguien tan igual y tan diferente a mí.", FOTO_CARACAS ? [FOTO_CARACAS] : []),
                capitulo("El 13 de octubre de 2026 te invité a mi casa para ver el lanzamiento de Artemis II. Ese día sentí que compartir cosas contigo me hace feliz de verdad."),
                capitulo("Y lo de la oficina... ahí hubo una chispa especial. Contigo todo se siente distinto, intenso y bonito.", [FOTO_OFICINA]),
                pasoJuegos,
                capitulo("Hubo un día loco: dejé mi teléfono en el carro de tu mami. Me dio miedo porque sabías mi clave, pero me enamoró más que respetaras no revisarlo.", FOTOS_TELEFONO),
                pasoMomentos,
                capitulo("Esta es mi foto favorita.", [FOTO_FAVORITA]),
                capitulo("Y aquí, otro momento de nosotros que también quiero guardar.", [FOTO_OTRO_MOMENTO]),
                pasoBanco,
                () => { semaforoBox.style.display = 'inline-block'; faseCohete(respuestaHistoria); }
            );
            sigPaso();
        }

        window.addEventListener('keydown', e => {
            if (canvas.style.display !== 'block' || S.fraseTomada) return;
            if (e.key === 'ArrowRight') S.dir = 1;
            if (e.key === 'ArrowLeft') S.dir = -1;
            if (['ArrowUp', ' ', 'w', 'W'].includes(e.key)) {
                e.preventDefault();
                saltar();
            }
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') S.dir = 0;
        });
        [['btn-izq', -1], ['btn-der', 1]].forEach(([id, d]) => {
            const b = document.getElementById(id);
            b.addEventListener('pointerdown', () => { S.dir = d; });
            ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => { S.dir = 0; }));
        });
        function saltar() {
            if (!['banco', 'coleccion'].includes(S.escena) || S.sentado || !S.suelo) return;
            S.suelo = false;
            S.vy = -7.2;
            sonidoRetro(520, 0.13, 'square');
        }
        const btnSalto = document.getElementById('btn-salto');
        btnSalto.addEventListener('pointerdown', event => { event.preventDefault(); saltar(); });
        btnSalto.addEventListener('click', saltar);
        document.getElementById('btn-sonido').addEventListener('click', event => {
            efectosActivos = !efectosActivos;
            event.currentTarget.textContent = efectosActivos ? '♪' : '×';
            event.currentTarget.setAttribute('aria-label', efectosActivos ? 'Silenciar efectos' : 'Activar efectos');
            if (efectosActivos) sonidoRetro(740, 0.12, 'triangle');
        });

        function faseCohete(respuesta) {
            setEscenaCompanero('cohete', 'pensar');
            limpiarEscena();
            let extra = respuesta === 'no' ? "¿Cómo que 'en serio'? Hagamos como que dijiste que sí... " : "";
            
            escenaAscii.style.display = 'flex';
            escenaAscii.style.height = '120px';
            escenaAscii.innerHTML = `<div class="cohete-anim">   /\\\n  (  )\n  (  )\n /|/\\|\\\n /_||_\\</div>`;

            typeWriter(extra + "Ya llevamos 2 meses de novios y aun así me sigue dando nervios preguntarte esto. Quiero que lo nuestro siga creciendo, a tu ritmo y con mucha paciencia... ¿Quieres seguir?", () => {
                botonesDinamicos.innerHTML = `<button onclick="granPregunta()">> Iniciar secuencia final <</button>`;
                botonesDinamicos.style.display = 'flex';
            });
        }

        function granPregunta() {
            setEscenaCompanero('pregunta', 'cargar');
            limpiarEscena();
            textoConsola.style.fontSize = '32px';
            textoConsola.style.textAlign = 'center';
            textoConsola.style.textShadow = '0 0 10px #4af626';

            typeWriter("Sydney Linda... ¿Quieres seguir siendo mi novia?", () => {
                botonesDinamicos.innerHTML = `
                    <button onclick="exito()" style="width: 80%; font-size: 28px; padding: 12px; margin-bottom: 5px;">> ¡SÍ! <3 <</button>
                    <button id="btn-no-final" ontouchstart="escaparBoton()" onmouseover="escaparBoton()" style="width: 50%;">> No <</button>`;
                botonesDinamicos.style.display = 'flex';
            });
        }

        function escaparBoton() {
            const btnNo = document.getElementById('btn-no-final');
            btnNo.style.position = 'absolute';
            btnNo.style.top = Math.random() * 80 + 'px';
            if (Math.random() > 0.5) {
                btnNo.style.left = '5%'; btnNo.style.right = 'auto';
            } else {
                btnNo.style.right = '5%'; btnNo.style.left = 'auto';
            }
        }

        function exito() {
            setEscenaCompanero('beso', 'beso');
            limpiarEscena();
            setEstadoMuneco('bailar');
            textoConsola.style.fontSize = '26px';
            textoConsola.innerHTML = "[SISTEMA HACKEADO CON ÉXITO] <br><br> Te quiero.";
            
            escenaAscii.style.display = 'flex';
            escenaAscii.style.height = '110px';
            
            escenaAscii.innerHTML = `
                <div class="escena-beso-container">
                    <div class="corazon-beso">♥</div>
                    <div class="pareja-beso">( -_-)   (-_- )</div>
                </div>`;

            setInterval(() => {
                const contenedorBeso = document.querySelector('.escena-beso-container');
                if (contenedorBeso) {
                    const corazon = document.createElement('div');
                    corazon.className = 'corazon-flotante';
                    corazon.innerText = '♥';
                    
                    const randomX = (Math.random() * 60 - 30) + 'px';
                    corazon.style.setProperty('--random-x', randomX);
                    corazon.style.animationDelay = Math.random() * 0.5 + 's';
                    
                    contenedorBeso.appendChild(corazon);

                    setTimeout(() => {
                        corazon.remove();
                    }, 3000);
                }
            }, 350);
        }
    </script>
</body>
</html>
